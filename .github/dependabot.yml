# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot

version: 2

registries:
  npm-npmjs:
    type: npm-registry
    url: https://registry.npmjs.org

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      langchain:
        patterns:
          - "langchain*"
          - "langgraph*"
          - "langsmith*"
      ml-frameworks:
        patterns:
          - "scikit-learn*"
          - "sentence-transformers*"
          - "faiss*"
      geospatial:
        patterns:
          - "geopandas*"
          - "rasterio*"
          - "shapely*"
      web:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "httpx*"
          - "aiohttp*"
    open-pull-requests-limit: 10

  # Node.js dependencies (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      react:
        patterns:
          - "react*"
          - "next*"
      ui:
        patterns:
          - "@radix-ui/*"
          - "tailwind*"
          - "lucide*"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"
