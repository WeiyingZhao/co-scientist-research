[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-co-scientist"
version = "0.1.0"
description = "A Geospatial AI Co-Scientist for remote sensing and GIS research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GeoReason Labs"}
]
keywords = ["geospatial", "ai", "co-scientist", "remote-sensing", "gis", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

dependencies = [
    # LangChain ecosystem (pinned to 0.3.x for stability, consider 1.0 migration)
    "langgraph>=0.2.0,<1.0",
    "langchain>=0.3.0,<1.0",
    "langchain-openai>=0.2.0,<1.0",
    "langchain-anthropic>=0.2.0,<1.0",
    "langchain-community>=0.3.0,<1.0",
    "langsmith>=0.1.0",
    # LLM providers
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    # Data validation
    "pydantic>=2.0.0,<3.0",
    "pydantic-settings>=2.0.0",
    # Scientific computing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    # Geospatial
    "geopandas>=0.14.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    # ML and embeddings
    "scikit-learn>=1.3.0",
    "faiss-cpu>=1.7.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    # HTTP clients
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
    # CLI and formatting
    "rich>=13.0.0",
    "typer>=0.9.0",
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.25.0",
    "websockets>=12.0",
    # Configuration
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",  # Parallel test execution
    # Code quality (Ruff replaces black, isort, flake8)
    "ruff>=0.9.0",
    "mypy>=1.5.0",
    # Git hooks
    "pre-commit>=3.5.0",
    # Security scanning
    "bandit[toml]>=1.8.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]
earth-engine = [
    "earthengine-api>=0.1.370",
]

[project.scripts]
geo-scientist = "geospatial_co_scientist.cli:app"

[project.urls]
Homepage = "https://github.com/georeason-labs/geospatial-co-scientist"
Documentation = "https://georeason-labs.github.io/geospatial-co-scientist"
Repository = "https://github.com/georeason-labs/geospatial-co-scientist"

[tool.setuptools.packages.find]
where = ["src"]

# Ruff configuration (replaces black, isort, flake8)
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print (no print statements)
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "S101",   # assert usage (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T20"]  # Allow assert and print in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true

# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # Skip assert warnings

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/geospatial_co_scientist --cov-report=term-missing"
